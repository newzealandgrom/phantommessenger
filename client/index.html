<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#080a0e" />
    <!--
      Baseline CSP served alongside the backend-set CSP header. The backend
      injects a nonce-based policy on the `/` route; this meta tag guarantees
      a deny-by-default posture when the static bundle is served from a
      CDN / object storage that does NOT control headers. `connect-src` has
      to allow both wss:// (relay WebSocket) and https:// (HTTP fallbacks
      and the /api endpoints on the same origin). `frame-ancestors` in a
      meta tag is ignored by browsers; we also emit it via the backend header.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' wss: https:; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none';"
    />
    <meta http-equiv="Referrer-Policy" content="no-referrer" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Phantom Messenger</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
