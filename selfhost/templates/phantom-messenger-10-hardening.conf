# Hardening relay (User=phantom). Ставит selfhost/install.sh как
#   /etc/systemd/system/phantom-messenger.service.d/10-hardening.conf
# Копия прод-файла scripts/systemd/phantom-messenger-10-hardening.conf.
[Service]
# Код в /opt/phantom-messenger read-only: не пытаться писать __pycache__.
Environment=PYTHONDONTWRITEBYTECODE=1
UMask=0077

NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
# Запись только в StateDirectory=/var/lib/phantom-messenger (state.json + state.tmp).
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
ProcSubset=pid
RemoveIPC=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
# Порт 8444 непривилегированный, файлы свои — capabilities не нужны.
CapabilityBoundingSet=
AmbientCapabilities=

MemoryHigh=384M
MemoryMax=512M
TasksMax=256
