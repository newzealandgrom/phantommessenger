# Managed by phantom-selfhost. coturn принимает UDP/TCP из интернета напрямую (Cloudflare TURN
# не проксирует), поэтому песочница максимально жёсткая при сохранении работы сокетов и чтения сертификата.
[Unit]
Wants=network-online.target
After=network-online.target

[Service]
# Журнал coturn (адреса пиров при ALLOCATE/CreatePermission) — только в RAM, как у relay:
#   journalctl --namespace=phantom -u coturn
LogNamespace=phantom
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectClock=yes
ProtectHostname=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes
ProtectProc=invisible
ProcSubset=pid
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
# AF_NETLINK нужен: coturn определяет адреса через getifaddrs().
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
# Занимаются только непривилегированные порты — capabilities не нужны.
CapabilityBoundingSet=
AmbientCapabilities=
UMask=0077
ReadWritePaths=/var/lib/turn
MemoryMax=256M
TasksMax=512
LimitNOFILE=65535
Restart=on-failure
RestartSec=3
